<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="566" viewBox="0 0 1320 566" role="img" aria-labelledby="title desc">
<title id="title">How Cairn recalls a decision</title>
<desc id="desc">Ordinary recall moves from current context to candidates to source. Known ID, lifecycle change, or high-impact check: go directly to L3. Project decisions change → discard the old brief and rebuild as needed.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#376369" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="return" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#8b4a2f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="1" y="1" width="1318" height="564" rx="23" fill="#f8fbfa" stroke="#e1eae7" stroke-width="2"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="48" y="67" font-size="40" font-weight="700" fill="#152c2d" text-anchor="start">How Cairn recalls a decision</text>
<text x="48" y="104" font-size="20" font-weight="500" fill="#4c5e60" text-anchor="start">Ordinary recall moves from current context to candidates to source.</text>
<path d="M210 205V166H1112V205" fill="none" stroke="#376369" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
<rect x="317" y="147" width="686" height="37" rx="12" fill="#f8fbfa"/>
<text x="660" y="172" font-size="18" font-weight="600" fill="#376369" text-anchor="middle">Known ID, lifecycle change, or high-impact check: go directly to L3</text>
<path d="M375 293h116" fill="none" stroke="#376369" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M825 293h116" fill="none" stroke="#376369" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="433" y="270" font-size="14" font-weight="600" fill="#376369" text-anchor="middle">Context missing</text>
<text x="883" y="249" font-size="12" font-weight="600" fill="#376369" text-anchor="middle">Candidates missing</text>
<text x="883" y="269" font-size="12" font-weight="600" fill="#376369" text-anchor="middle">or read incomplete</text>
<path d="M1112 414v38H660v-38" fill="none" stroke="#8b4a2f" stroke-width="2" marker-end="url(#return)"/>
<text x="884" y="486" font-size="16" font-weight="600" fill="#8b4a2f" text-anchor="middle">Project decisions change → discard the old brief and rebuild as needed</text>
<path d="M48 519h1224" stroke="#e1eae7"/>
<text x="48" y="545" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">Mechanism diagram · Cairn does not store the brief</text>
<g id="l1">
<rect x="48" y="209" width="324" height="199" rx="19" fill="#ffffff" stroke="#d8e5e1" stroke-width="2"/>
<text x="72" y="246" font-size="16" font-weight="700" fill="#376369" text-anchor="start">L1 · HOST</text>
<text x="72" y="283" font-size="28" font-weight="700" fill="#152c2d" text-anchor="start">Current context</text>
<path d="M72 303h276" stroke="#d8e5e1"/>
<text x="72" y="336" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">Information already in the task.</text>
<text x="72" y="366" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">Continue when it is sufficient.</text>
</g>
<g id="l2">
<rect x="498" y="209" width="324" height="199" rx="19" fill="#e8f6f6" stroke="#75a9ad" stroke-width="2"/>
<text x="522" y="246" font-size="16" font-weight="700" fill="#376369" text-anchor="start">L2 · HOST</text>
<text x="522" y="283" font-size="28" font-weight="700" fill="#152c2d" text-anchor="start">Thread brief</text>
<path d="M522 303h276" stroke="#75a9ad"/>
<text x="522" y="336" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">Short-lived project/thread candidates.</text>
<text x="522" y="366" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">Match literal terms; check before reuse.</text>
</g>
<g id="l3">
<rect x="948" y="209" width="324" height="199" rx="19" fill="#ffffff" stroke="#d8e5e1" stroke-width="2"/>
<text x="972" y="246" font-size="16" font-weight="700" fill="#376369" text-anchor="start">L3 · CAIRN</text>
<text x="972" y="283" font-size="28" font-weight="700" fill="#152c2d" text-anchor="start">Decision repository</text>
<path d="M972 303h276" stroke="#d8e5e1"/>
<text x="972" y="336" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">Source of truth for decisions and history.</text>
<text x="972" y="366" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">Read by ID; change through the Protocol.</text>
</g>
</g>
</svg>
