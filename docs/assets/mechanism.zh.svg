  <rect x="90" y="472" width="352" height="28" rx="10" fill="#fff5e7"/><text x="266" y="491" text-anchor="middle" class="small" style="fill:#945e28">每次触发都加载全部路径</text>
  <path d="M486 398H554" stroke="#282437" stroke-width="2.7" marker-end="url(#arrow)"/>

  <rect x="582" y="272" width="314" height="250" rx="24" fill="#fff" class="outline" filter="url(#shadow)"/>
