    <text x="1048" y="361" font-size="17" font-weight="720" class="">recall.md</text>
    <text x="1048" y="385" class="small muted">找决定并判断覆盖是否完整</text>
<rect x="1266" y="334" width="222" height="68" rx="16" fill="#f4f1fa" stroke="#d9cfef"/>
    <text x="1286" y="361" font-size="17" font-weight="720" class="">record.md</text>
    <text x="1286" y="385" class="small muted">记录并保留决定生命周期</text>
<rect x="1028" y="416" width="222" height="68" rx="16" fill="#f4f1fa" stroke="#d9cfef"/>
    <text x="1048" y="443" font-size="17" font-weight="720" class="">operations.md</text>
