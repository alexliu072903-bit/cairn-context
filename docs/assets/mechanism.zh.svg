    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#201c2c}.title{font-size:49px;font-weight:760;letter-spacing:-1.5px}.heading{font-size:25px;font-weight:730}.body{font-size:18px}.small{font-size:14px}.muted{fill:#6d6879}.purple{fill:#6f42e8}.light{fill:#fff}.green{fill:#12856a}.outline{stroke:#282437;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbfaff"/>
  <text x="64" y="66" font-size="20" font-weight="700">CAIRN CONTEXT</text>
