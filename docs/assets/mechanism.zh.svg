  <path d="M66 138C196 123 325 126 438 139" fill="none" stroke="#b395ff" stroke-width="12" stroke-linecap="round" opacity=".66"/>
  <text x="64" y="166" class="body muted">Agent 只加载当前任务需要的工作流，再把正确的决定提升到当前 Context。</text>
