<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="566" viewBox="0 0 1320 566" role="img" aria-labelledby="title desc">
<title id="title">Cairn 如何找回项目决定</title>
<desc id="desc">普通召回：先用现有 Context，再找候选，最后查原文。 已知 ID、决定变更或高影响核对：直接查 L3. 项目决定变化 → 丢弃旧简报，按需重建.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#376369" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="return" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#8b4a2f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="1" y="1" width="1318" height="564" rx="23" fill="#f8fbfa" stroke="#e1eae7" stroke-width="2"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="48" y="67" font-size="40" font-weight="700" fill="#152c2d" text-anchor="start">Cairn 如何找回项目决定</text>
<text x="48" y="104" font-size="20" font-weight="500" fill="#4c5e60" text-anchor="start">普通召回：先用现有 Context，再找候选，最后查原文。</text>
<path d="M210 205V166H1112V205" fill="none" stroke="#376369" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
<rect x="317" y="147" width="686" height="37" rx="12" fill="#f8fbfa"/>
<text x="660" y="172" font-size="18" font-weight="600" fill="#376369" text-anchor="middle">已知 ID、决定变更或高影响核对：直接查 L3</text>
<path d="M375 293h116" fill="none" stroke="#376369" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M825 293h116" fill="none" stroke="#376369" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="433" y="270" font-size="14" font-weight="600" fill="#376369" text-anchor="middle">信息不足</text>
<text x="883" y="249" font-size="12" font-weight="600" fill="#376369" text-anchor="middle">候选不足</text>
<text x="883" y="269" font-size="12" font-weight="600" fill="#376369" text-anchor="middle">或读取不完整</text>
<path d="M1112 414v38H660v-38" fill="none" stroke="#8b4a2f" stroke-width="2" marker-end="url(#return)"/>
<text x="884" y="486" font-size="16" font-weight="600" fill="#8b4a2f" text-anchor="middle">项目决定变化 → 丢弃旧简报，按需重建</text>
<path d="M48 519h1224" stroke="#e1eae7"/>
<text x="48" y="545" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">机制示意 · Cairn 不保存简报</text>
<g id="l1">
<rect x="48" y="209" width="324" height="199" rx="19" fill="#ffffff" stroke="#d8e5e1" stroke-width="2"/>
<text x="72" y="246" font-size="16" font-weight="700" fill="#376369" text-anchor="start">L1 · 宿主</text>
<text x="72" y="283" font-size="28" font-weight="700" fill="#152c2d" text-anchor="start">当前 Context</text>
<path d="M72 303h276" stroke="#d8e5e1"/>
<text x="72" y="336" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">已在当前任务中的信息</text>
<text x="72" y="366" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">足够时，直接继续</text>
</g>
<g id="l2">
<rect x="498" y="209" width="324" height="199" rx="19" fill="#e8f6f6" stroke="#75a9ad" stroke-width="2"/>
<text x="522" y="246" font-size="16" font-weight="700" fill="#376369" text-anchor="start">L2 · 宿主</text>
<text x="522" y="283" font-size="28" font-weight="700" fill="#152c2d" text-anchor="start">线程简报</text>
<path d="M522 303h276" stroke="#75a9ad"/>
<text x="522" y="336" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">按项目和线程保留短期候选</text>
<text x="522" y="366" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">按字面匹配，复用前检查快照</text>
</g>
<g id="l3">
<rect x="948" y="209" width="324" height="199" rx="19" fill="#ffffff" stroke="#d8e5e1" stroke-width="2"/>
<text x="972" y="246" font-size="16" font-weight="700" fill="#376369" text-anchor="start">L3 · CAIRN</text>
<text x="972" y="283" font-size="28" font-weight="700" fill="#152c2d" text-anchor="start">决定仓库</text>
<path d="M972 303h276" stroke="#d8e5e1"/>
<text x="972" y="336" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">唯一事实来源，保留决定原文和历史</text>
<text x="972" y="366" font-size="15" font-weight="500" fill="#4c5e60" text-anchor="start">按 ID 查原文，按协议变更决定</text>
</g>
</g>
</svg>
