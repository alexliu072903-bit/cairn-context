<rect x="1266" y="416" width="222" height="68" rx="16" fill="#2b263c" stroke="#2b263c"/>
    <text x="1286" y="443" font-size="17" font-weight="720" class="light">access.md</text>
    <text x="1286" y="467" class="small light">精确 CLI 与 JSON 合同</text>

  <path d="M64 560H1536" stroke="#ded8ea" stroke-width="2"/>
  <rect x="64" y="588" width="72" height="36" rx="18" fill="#dfd1ff"/><text x="100" y="613" text-anchor="middle" font-size="20" font-weight="760" class="purple">B</text>
  <text x="154" y="614" class="heading">Context 数据层</text>

  <rect x="66" y="652" width="420" height="150" rx="22" fill="#fff" class="outline" filter="url(#shadow)"/>
  <rect x="88" y="674" width="56" height="28" rx="14" fill="#ded0ff"/><text x="116" y="694" text-anchor="middle" font-size="16" font-weight="740" class="purple">L1</text>
  <text x="158" y="697" font-size="21" font-weight="730">当前 Context</text><text x="90" y="733" class="small muted">已有依据 → 继续任务</text>
<text x="90" y="759" class="small muted">缺少决定 → 请求 Hot Context</text>
  <rect x="90" y="772" width="194" height="22" rx="11" fill="#fff4e5"/><text x="187" y="788" text-anchor="middle" font-size="12" style="fill:#945e28">7 天还是 14 天？</text>
  <path d="M488 727H550" stroke="#282437" stroke-width="2.7" marker-end="url(#arrow)"/>

  <rect x="578" y="652" width="444" height="150" rx="22" fill="#eee8ff" class="outline" filter="url(#shadow)"/>
  <rect x="600" y="674" width="56" height="28" rx="14" fill="#7c4df2"/><text x="628" y="694" text-anchor="middle" font-size="16" font-weight="740" class="light">L2</text>
  <text x="670" y="697" font-size="21" font-weight="730">Hot Context brief</text><text x="602" y="733" class="small muted">brief：少量候选、scope、revision</text>
<text x="602" y="759" class="small muted">brief-check：fresh / stale / read source</text>
  <rect x="602" y="772" width="230" height="22" rx="11" fill="#e3faf3"/><text x="717" y="788" text-anchor="middle" font-size="12" class="green">7 天完整历史 · ref</text>
  <path d="M1024 727H1086" stroke="#282437" stroke-width="2.7" marker-end="url(#arrow)"/>

  <rect x="1114" y="652" width="420" height="150" rx="22" fill="#fff" class="outline" filter="url(#shadow)"/>
  <rect x="1136" y="674" width="56" height="28" rx="14" fill="#e8e9ed"/><text x="1164" y="694" text-anchor="middle" font-size="16" font-weight="740">L3</text>
  <text x="1206" y="697" font-size="21" font-weight="730">长期决定 · Source of truth</text><text x="1138" y="733" class="small muted">原文、历史链、纠正与来源</text>
<text x="1138" y="759" class="small muted">项目任一决定变化 → 旧 brief stale</text>
  <rect x="1138" y="772" width="200" height="22" rx="11" fill="#fdebed"/><text x="1238" y="788" text-anchor="middle" font-size="12" style="fill:#a94857">stale → rebuild</text>

  <rect x="64" y="836" width="1472" height="42" rx="21" fill="#2b263c"/>
  <text x="196" y="863" text-anchor="middle" font-size="14" class="light">Agent 判断相关性</text><path d="M360 846V868" stroke="#625b72"/>
  <text x="738" y="863" text-anchor="middle" font-size="14" class="light">L2 临时且可校验</text><path d="M1080 846V868" stroke="#625b72"/>
  <text x="1306" y="863" text-anchor="middle" font-size="14" class="light">L3 保存长期事实</text>
